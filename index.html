<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Almacén de Ideas · Acceso Restringido</title>
  <link rel="manifest" href="/notas-rapidas/manifest.json">
  <meta name="theme-color" content="#f5a623">
  <link rel="apple-touch-icon" href="/notas-rapidas/icon-192.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0f1117;
      --surface:  #1a1d27;
      --surface2: #222636;
      --border:   #2e3347;
      --text:     #e8eaf0;
      --muted:    #7b82a0;
      --acento:   #f5a623;
      --navy:     #1a2744;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
    }

    /* ── PANTALLA DE LOGIN ─────────────────────────────────────────── */
    #login-screen {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg);
      z-index: 1000;
    }
    .login-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 48px;
      width: 360px;
      text-align: center;
    }
    .login-box .logo {
      font-size: 1.6rem; font-weight: 800; letter-spacing: 2px;
      color: var(--acento); margin-bottom: 4px;
    }
    .login-box .subtitulo {
      font-size: 0.76rem; color: var(--muted);
      text-transform: uppercase; letter-spacing: 1px; margin-bottom: 32px;
    }
    .login-box label {
      display: block; text-align: left;
      font-size: 0.78rem; color: var(--muted);
      text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px;
    }
    .login-box input[type="password"] {
      width: 100%; padding: 12px 16px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text);
      font-size: 1rem; margin-bottom: 16px;
      outline: none; transition: border-color .2s;
    }
    .login-box input[type="password"]:focus { border-color: var(--acento); }
    .login-box button {
      width: 100%; padding: 12px;
      background: var(--acento); color: #111;
      border: none; border-radius: 8px;
      font-size: 0.95rem; font-weight: 700;
      cursor: pointer; transition: opacity .2s;
    }
    .login-box button:hover { opacity: .88; }
    .login-box .error-msg {
      color: #e57373; font-size: 0.82rem;
      margin-top: 10px; min-height: 18px;
    }
    .login-box .pie {
      margin-top: 24px; font-size: 0.72rem; color: var(--muted);
    }

    /* ── APP PRINCIPAL ─────────────────────────────────────────────── */
    #app { display: none; }

    .app-header {
      background: var(--navy);
      border-bottom: 2px solid var(--acento);
      padding: 20px 24px;
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 12px;
    }
    .app-header .titulo-grupo { display: flex; flex-direction: column; }
    .app-header .titulo {
      font-size: 1.3rem; font-weight: 800;
      color: var(--acento); letter-spacing: 1px;
    }
    .app-header .sub {
      font-size: 0.72rem; color: #9baac9;
      text-transform: uppercase; letter-spacing: 1px;
    }
    .app-header .stats { font-size: 0.78rem; color: var(--muted); text-align: right; }
    .app-header .stats strong { color: var(--acento); }
    .btn-salir {
      background: transparent; border: 1px solid var(--border);
      color: var(--muted); padding: 6px 14px; border-radius: 6px;
      font-size: 0.78rem; cursor: pointer; transition: all .2s;
    }
    .btn-salir:hover { border-color: var(--acento); color: var(--acento); }

    .controles {
      padding: 20px 24px 0;
      display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    }
    .busqueda {
      flex: 1; min-width: 220px; max-width: 380px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 14px;
      color: var(--text); font-size: 0.9rem; outline: none;
      transition: border-color .2s;
    }
    .busqueda:focus { border-color: var(--acento); }
    .busqueda::placeholder { color: var(--muted); }
    .contador-resultados { font-size: 0.8rem; color: var(--muted); white-space: nowrap; }

    .filtros {
      padding: 16px 24px;
      display: flex; flex-wrap: wrap; gap: 8px;
    }
    .pill {
      padding: 5px 14px; border-radius: 20px;
      border: 1px solid var(--border);
      font-size: 0.75rem; font-weight: 600; cursor: pointer;
      transition: all .18s; color: var(--muted);
      background: var(--surface); white-space: nowrap;
    }
    .pill.activa { color: #111 !important; border-color: transparent; }

    .grid {
      padding: 16px 24px 48px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 14px;
    }
    .tarjeta {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px;
      display: flex; flex-direction: column; gap: 8px;
      transition: border-color .18s, transform .18s;
    }
    .tarjeta:hover { transform: translateY(-2px); }
    .tarjeta-header { display: flex; align-items: flex-start; gap: 10px; }
    .numero {
      font-size: 0.7rem; font-weight: 700;
      padding: 3px 8px; border-radius: 6px;
      background: var(--surface2); color: var(--muted);
      white-space: nowrap; margin-top: 2px; flex-shrink: 0;
    }
    .nombre-app { font-size: 1rem; font-weight: 700; color: var(--text); line-height: 1.3; }
    .descripcion { font-size: 0.82rem; color: #b0b8d0; line-height: 1.55; }
    .cat-tag {
      display: inline-block; margin-top: 4px;
      padding: 3px 10px; border-radius: 12px;
      font-size: 0.68rem; font-weight: 700;
      color: #111; align-self: flex-start;
    }
    .sin-resultados {
      text-align: center; padding: 60px 20px;
      color: var(--muted); font-size: 0.9rem; grid-column: 1/-1;
    }

    /* Paleta por categoría */
    .c0 { border-color: #1565c030; } .c0:hover { border-color: #64b5f680; }
    .c0 .nombre-app, .pill.c0 { color: #64b5f6; }
    .pill.c0.activa { background: #64b5f6; }
    .c0 .cat-tag { background: #64b5f6; }

    .c1 { border-color: #2e7d3230; } .c1:hover { border-color: #81c78480; }
    .c1 .nombre-app, .pill.c1 { color: #81c784; }
    .pill.c1.activa { background: #81c784; }
    .c1 .cat-tag { background: #81c784; }

    .c2 { border-color: #6a1b9a30; } .c2:hover { border-color: #ce93d880; }
    .c2 .nombre-app, .pill.c2 { color: #ce93d8; }
    .pill.c2.activa { background: #ce93d8; }
    .c2 .cat-tag { background: #ce93d8; }

    .c3 .nombre-app, .pill.c3 { color: #aed581; }
    .pill.c3.activa { background: #aed581; }

    .c5 .nombre-app, .pill.c5 { color: #4dd0e1; }
    .pill.c5.activa { background: #4dd0e1; }
    .c5 .cat-tag { background: #4dd0e1; }

    .c6 { border-color: #4527a030; } .c6:hover { border-color: #b39ddb80; }
    .c6 .nombre-app, .pill.c6 { color: #b39ddb; }
    .pill.c6.activa { background: #b39ddb; }
    .c6 .cat-tag { background: #b39ddb; }

    .c7 { border-color: #00695c30; } .c7:hover { border-color: #80cbc480; }

    .c8 .cat-tag { background: #f48fb1; }

    .c9 { border-color: #c6282830; } .c9:hover { border-color: #ef9a9a80; }
    .c9 .nombre-app, .pill.c9 { color: #ef9a9a; }

    .c9 .cat-tag { background: #ef9a9a; }

    mark { background: #f5a62340; color: var(--acento); border-radius: 2px; padding: 0 1px; }

    @media (max-width: 600px) {
      .app-header { padding: 16px; }
      .grid { padding: 12px 12px 40px; grid-template-columns: 1fr; }
      .controles, .filtros { padding-left: 12px; padding-right: 12px; }
      .login-box { padding: 32px 24px; width: 90vw; }
    }
  </style>
</head>

    const input = document.getElementById('clave').value;

      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      renderizar();
    } else {
      const err = document.getElementById('login-error');
      err.textContent = 'Contraseña incorrecta. Intentá de nuevo.';

  // ── ESTADO ────────────────────────────────────────────────────────
  let categoriaActiva = null;

  // ── PILLS ─────────────────────────────────────────────────────────
  function renderizarFiltros() {
    const cont = document.getElementById('filtros');
    cont.innerHTML = '';
    const todas = document.createElement('button');
    todas.className = 'pill' + (categoriaActiva === null ? ' activa' : '');
    if (categoriaActiva === null) {
      todas.style.cssText = 'background:var(--acento);color:#111;border-color:transparent;';
    }
    todas.textContent = 'Todas (100)';
    todas.onclick = () => { categoriaActiva = null; renderizar(); };
    cont.appendChild(todas);

    CATEGORIAS.forEach(c => {
      const btn = document.createElement('button');
      btn.className = 'pill c' + c.id + (categoriaActiva === c.id ? ' activa' : '');
      btn.textContent = c.nombre;
      btn.onclick = () => {
        categoriaActiva = (categoriaActiva === c.id) ? null : c.id;
        renderizar();
      };
      cont.appendChild(btn);
    });
  }

  // ── HIGHLIGHT ─────────────────────────────────────────────────────
  function hl(txt, q) {
    if (!q) return txt;
    const re = new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
    return txt.replace(re, '<mark>$1</mark>');
  }

  // ── RENDER ────────────────────────────────────────────────────────
  function renderizar() {
    const q = document.getElementById('busqueda').value.trim().toLowerCase();
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    renderizarFiltros();

    const filtradas = IDEAS.filter(i =>
      (categoriaActiva === null || i.cat === categoriaActiva) &&
      (!q || i.app.toLowerCase().includes(q) ||
             i.desc.toLowerCase().includes(q) ||
             String(i.n).includes(q))
    );

    document.getElementById('num-visibles').textContent = filtradas.length;
    document.getElementById('contador').textContent =
      filtradas.length < 100 ? `${filtradas.length} resultados` : '';

    if (!filtradas.length) {
      grid.innerHTML = '<div class="sin-resultados">Sin resultados para ese criterio.</div>';
      return;
    }

    filtradas.forEach(idea => {
      const cat = CATEGORIAS[idea.cat];
      const d = document.createElement('div');
      d.className = `tarjeta c${idea.cat}`;
      d.innerHTML = `
        <div class="tarjeta-header">
          <span class="numero">#${idea.n}</span>
          <span class="nombre-app">${hl(idea.app, q)}</span>
        </div>
        <div class="descripcion">${hl(idea.desc, q)}</div>
        <span class="cat-tag">${cat.nombre}</span>`;
      grid.appendChild(d);
    });
  }
</script>
