<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notas Rápidas</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg:       #1a1a1a;
      --surface:  #242424;
      --surface2: #2c2c2c;
      --border:   #333;
      --acento:   #f5a623;
      --texto:    #f0f0f0;
      --muted:    #888;
      --rojo:     #e05252;
      --radio:    10px;
    }

    body {
      background: var(--bg);
      color: var(--texto);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      gap: 28px;
    }

    /* ── Cabecera ── */
    header {
      width: 100%;
      max-width: 680px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .contador-total {
      font-size: 13px;
      color: var(--muted);
    }

    /* ── Formulario nueva nota ── */
    .form-nota {
      width: 100%;
      max-width: 680px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radio);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .form-nota input,
    .form-nota textarea {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--texto);
      font-family: inherit;
      font-size: 14px;
      padding: 10px 14px;
      width: 100%;
      outline: none;
      transition: border-color 0.2s;
      resize: none;
    }

    .form-nota input:focus,
    .form-nota textarea:focus {
      border-color: var(--acento);
    }

    .form-nota input::placeholder,
    .form-nota textarea::placeholder {
      color: var(--muted);
    }

    .form-nota textarea {
      height: 90px;
    }

    .btn-guardar {
      align-self: flex-end;
      padding: 10px 28px;
      border-radius: 999px;
      border: none;
      background: var(--acento);
      color: #111;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn-guardar:hover  { opacity: 0.85; }
    .btn-guardar:active { transform: scale(0.97); }

    /* ── Buscador ── */
    .buscador-wrap {
      width: 100%;
      max-width: 680px;
      position: relative;
    }

    .buscador {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--texto);
      font-family: inherit;
      font-size: 14px;
      padding: 10px 20px 10px 42px;
      outline: none;
      transition: border-color 0.2s;
    }

    .buscador:focus { border-color: var(--acento); }
    .buscador::placeholder { color: var(--muted); }

    .icono-buscar {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 15px;
      pointer-events: none;
    }

    /* ── Lista de notas ── */
    .lista-notas {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ── Tarjeta de nota ── */
    .nota {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radio);
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: border-color 0.2s;
      animation: aparecer 0.2s ease;
    }

    @keyframes aparecer {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .nota:hover { border-color: #555; }

    .nota-cabecera {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .nota-titulo {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.3;
    }

    .nota-titulo mark {
      background: var(--acento);
      color: #111;
      border-radius: 3px;
      padding: 0 2px;
    }

    .btn-eliminar {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
      line-height: 1;
    }

    .btn-eliminar:hover {
      color: var(--rojo);
      border-color: var(--rojo);
      background: rgba(224,82,82,0.08);
    }

    .nota-contenido {
      font-size: 14px;
      color: #ccc;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .nota-contenido mark {
      background: var(--acento);
      color: #111;
      border-radius: 3px;
      padding: 0 2px;
    }

    .nota-fecha {
      font-size: 11px;
      color: var(--muted);
    }

    /* ── Estado vacío ── */
    .vacio {
      text-align: center;
      color: var(--muted);
      padding: 48px 0;
      font-size: 14px;
      line-height: 2;
    }

    .vacio-icono {
      font-size: 36px;
      display: block;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

  <!-- Cabecera -->
  <header>
    <h1>Notas Rápidas</h1>
    <span class="contador-total" id="contador-total">0 notas</span>
  </header>

  <!-- Formulario nueva nota -->
  <form class="form-nota" id="form-nota" onsubmit="guardarNota(event)">
    <input
      type="text"
      id="input-titulo"
      placeholder="Título de la nota..."
      maxlength="100"
      autocomplete="off"
    />
    <textarea
      id="input-contenido"
      placeholder="Escribe tu nota aquí..."
    ></textarea>
    <button type="submit" class="btn-guardar">Guardar</button>
  </form>

  <!-- Buscador -->
  <div class="buscador-wrap">
    <span class="icono-buscar">⌕</span>
    <input
      type="text"
      class="buscador"
      id="buscador"
      placeholder="Buscar en tus notas..."
      oninput="renderNotas()"
      autocomplete="off"
    />
  </div>

  <!-- Lista de notas -->
  <div class="lista-notas" id="lista-notas"></div>

  <script>
    // ── Estado ────────────────────────────────────────────────
    // Las notas se guardan en localStorage como array de objetos JSON
    // Cada nota: { id, titulo, contenido, fecha }

    const CLAVE_STORAGE = 'notas-rapidas-v1';

    // Carga las notas desde localStorage (o array vacío si no hay nada)
    function cargarNotas() {
      const datos = localStorage.getItem(CLAVE_STORAGE);
      return datos ? JSON.parse(datos) : [];
    }

    // Guarda el array completo en localStorage
    function persistirNotas(notas) {
      localStorage.setItem(CLAVE_STORAGE, JSON.stringify(notas));
    }

    // ── Guardar nota nueva ────────────────────────────────────
    function guardarNota(evento) {
      evento.preventDefault(); // evita que el form recargue la página

      const titulo    = document.getElementById('input-titulo').value.trim();
      const contenido = document.getElementById('input-contenido').value.trim();

      // Necesita al menos título o contenido
      if (!titulo && !contenido) {
        document.getElementById('input-titulo').focus();
        return;
      }

      const notas = cargarNotas();

      // Nueva nota con ID único basado en timestamp
      const nuevaNota = {
        id:        Date.now(),
        titulo:    titulo || 'Sin título',
        contenido: contenido,
        fecha:     new Date().toLocaleDateString('es-ES', {
                     day: '2-digit', month: 'short', year: 'numeric',
                     hour: '2-digit', minute: '2-digit'
                   })
      };

      // Agrega al inicio del array (más reciente primero)
      notas.unshift(nuevaNota);
      persistirNotas(notas);

      // Limpia el formulario
      document.getElementById('input-titulo').value    = '';
      document.getElementById('input-contenido').value = '';
      document.getElementById('input-titulo').focus();

      renderNotas();
    }

    // ── Eliminar nota ─────────────────────────────────────────
    function eliminarNota(id) {
      let notas = cargarNotas();
      notas = notas.filter(n => n.id !== id);
      persistirNotas(notas);
      renderNotas();
    }

    // ── Resaltar texto buscado ────────────────────────────────
    // Envuelve las coincidencias en <mark> para mostrarlas resaltadas
    function resaltar(texto, busqueda) {
      if (!busqueda) return texto;
      const regex = new RegExp(`(${busqueda.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
      return texto.replace(regex, '<mark>$1</mark>');
    }

    // ── Renderizar lista ──────────────────────────────────────
    function renderNotas() {
      const contenedor = document.getElementById('lista-notas');
      const busqueda   = document.getElementById('buscador').value.trim().toLowerCase();
      let   notas      = cargarNotas();

      // Filtra si hay texto en el buscador
      if (busqueda) {
        notas = notas.filter(n =>
          n.titulo.toLowerCase().includes(busqueda) ||
          n.contenido.toLowerCase().includes(busqueda)
        );
      }

      // Actualiza el contador
      const total = cargarNotas().length;
      document.getElementById('contador-total').textContent =
        `${total} ${total === 1 ? 'nota' : 'notas'}`;

      // Estado vacío
      if (notas.length === 0) {
        contenedor.innerHTML = `
          <div class="vacio">
            <span class="vacio-icono">${busqueda ? '🔍' : '📝'}</span>
            ${busqueda
              ? `No hay notas que coincidan con "<strong>${busqueda}</strong>"`
              : 'Aún no tienes notas.<br>¡Escribe tu primera nota arriba!'}
          </div>`;
        return;
      }

      // Genera el HTML de cada nota
      contenedor.innerHTML = notas.map(nota => `
        <div class="nota" id="nota-${nota.id}">
          <div class="nota-cabecera">
            <span class="nota-titulo">${resaltar(nota.titulo, busqueda)}</span>
            <button class="btn-eliminar" onclick="eliminarNota(${nota.id})" title="Eliminar nota">✕</button>
          </div>
          ${nota.contenido
            ? `<p class="nota-contenido">${resaltar(nota.contenido, busqueda)}</p>`
            : ''}
          <span class="nota-fecha">${nota.fecha}</span>
        </div>
      `).join('');
    }

    // ── Inicialización ────────────────────────────────────────
    renderNotas();
  </script>
</body>
</html>
